name: unpack
description: Download a stage output into a directory (decrypts production artifacts with the BACKUP_KEY secret).
inputs:
  name:
    description: artifact name (or pattern when merge=true)
    required: true
  dest:
    description: destination directory
    required: true
  mode:
    required: true
  key:
    description: age identity (secret) for production jobs
    required: false
    default: ""
  pattern:
    description: use pattern instead of name
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Download (by name)
      if: inputs.pattern == ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ runner.temp }}/dl-${{ inputs.name }}
    - name: Download (by pattern)
      if: inputs.pattern != ''
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: ${{ inputs.pattern }}
        path: ${{ runner.temp }}/dl-${{ inputs.name }}
    - name: Place files
      shell: bash
      env:
        AGE_KEY: ${{ inputs.key }}
      run: |
        src="$RUNNER_TEMP/dl-${{ inputs.name }}"
        mkdir -p "${{ inputs.dest }}"
        if [ "${{ inputs.mode }}" = "job" ]; then
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq age >/dev/null
          umask 077; printf '%s\n' "$AGE_KEY" > "$RUNNER_TEMP/age.key"
          find "$src" -name '*.tar.age' -print0 | while IFS= read -r -d '' f; do
            age -d -i "$RUNNER_TEMP/age.key" < "$f" | tar -C "${{ inputs.dest }}" -xf -
          done
          rm -f "$RUNNER_TEMP/age.key"
        else
          cp -r "$src"/. "${{ inputs.dest }}"/
        fi
