name: produce
# Turns jobs/<slug>/script.md (encrypted) or pilot/<slug>/script.md (public test content) into a finished video bundle.
on:
  push:
    branches: [main]
    paths:
      - "jobs/**/script.md"
      - "pilot/**/script.md"
  workflow_dispatch:
    inputs:
      job_dir:
        description: "jobs/<slug> or pilot/<slug>"
        required: true
      until:
        description: "stop after: plan | tts | images | assemble | render | all"
        default: all

permissions:
  contents: read

concurrency:
  group: produce-${{ inputs.job_dir || github.sha }}
  cancel-in-progress: true

env:
  AGE_RECIPIENT: age1a29zkhm3egxk30kdylsygf6pdkvkk2j6dz4h5qqacvga8ezf550qwl54rq

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      job_dir: ${{ steps.dir.outputs.job_dir }}
      slug: ${{ steps.plan.outputs.slug }}
      mode: ${{ steps.plan.outputs.mode }}
      tts_hash: ${{ steps.plan.outputs.tts_hash }}
      img_hash: ${{ steps.plan.outputs.img_hash }}
      tts_shards: ${{ steps.plan.outputs.tts_shards }}
      img_shards: ${{ steps.plan.outputs.img_shards }}
      n_tts: ${{ steps.plan.outputs.n_tts }}
      n_img: ${{ steps.plan.outputs.n_img }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Resolve job directory
        id: dir
        env:
          INPUT_DIR: ${{ inputs.job_dir }}
        run: |
          if [ -n "$INPUT_DIR" ]; then d="$INPUT_DIR"; else
            f=$(git diff --name-only HEAD~1 HEAD | grep -E '^(jobs|pilot)/[^/]+/script\.md$' | head -1)
            d=$(dirname "$f")
          fi
          test -n "$d" || { echo "::error::no job directory found"; exit 1; }
          echo "job_dir=$d" >> "$GITHUB_OUTPUT"
          echo "Job: $d"
      - name: Preflight (fail fast, one clear line)
        id: pre
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          d="${{ steps.dir.outputs.job_dir }}"
          case "$d" in
            pilot/*) echo "mode=pilot (public test content, no secrets needed)";;
            jobs/*)
              [ -n "$GIT_CRYPT_KEY" ] || { echo "::error::PREFLIGHT: GIT_CRYPT_KEY secret missing - add it (docs/USER_CHECKLIST.md step 1)"; exit 1; }
              [ -n "$BACKUP_KEY" ] || { echo "::error::PREFLIGHT: BACKUP_KEY secret missing - add it (docs/USER_CHECKLIST.md step 1)"; exit 1; }
              sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq git-crypt >/dev/null
              umask 077; printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
              git-crypt unlock "$RUNNER_TEMP/gc.key"; rm -f "$RUNNER_TEMP/gc.key"
              head -c 9 "$d/script.md" | grep -q GITCRYPT && { echo "::error::PREFLIGHT: unlock failed"; exit 1; } || true;;
            *) echo "::error::unknown job directory $d"; exit 1;;
          esac
          df -h / | tail -1
      - name: Validate + plan
        id: plan
        run: |
          d="${{ steps.dir.outputs.job_dir }}"
          python -m factory.validate "$d"
          python -m factory.plan "$d" --out build/plan
      - uses: ./.github/actions/pack
        with:
          name: plan
          path: build/plan
          mode: ${{ steps.plan.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  tts:
    needs: prepare
    if: inputs.until != 'plan'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.tts_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/unpack
        with:
          name: plan
          dest: build/plan
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Reuse finished shard (content-hash cache)
        id: shardcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tts
          key: tts-v3-${{ needs.prepare.outputs.slug }}-${{ needs.prepare.outputs.n_tts }}-${{ matrix.shard }}-${{ needs.prepare.outputs.tts_hash }}
          restore-keys: |
            tts-v3-${{ needs.prepare.outputs.slug }}-${{ needs.prepare.outputs.n_tts }}-${{ matrix.shard }}-
            tts-v2-70bbde60a9bd-${{ needs.prepare.outputs.n_tts }}-${{ matrix.shard }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.shardcache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/tts.txt
      - name: Model cache
        if: steps.shardcache.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/huggingface
            build/.asr
          key: models-tts-v1
      - name: Install
        if: steps.shardcache.outputs.cache-hit != 'true'
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg libsndfile1
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/tts.txt
      - name: Unlock voices (production only)
        if: needs.prepare.outputs.mode == 'job' && steps.shardcache.outputs.cache-hit != 'true'
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq git-crypt >/dev/null
          umask 077; printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"; rm -f "$RUNNER_TEMP/gc.key"
      - name: Synthesise + ASR-check this shard
        if: steps.shardcache.outputs.cache-hit != 'true'
        run: python -m factory.tts build/plan/plan.json --out build/tts --shard ${{ matrix.shard }} --shards ${{ needs.prepare.outputs.n_tts || 8 }}
      - uses: ./.github/actions/pack
        with:
          name: tts-${{ matrix.shard }}
          path: build/tts
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  images:
    needs: prepare
    if: inputs.until != 'plan' && inputs.until != 'tts'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.prepare.outputs.img_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/unpack
        with:
          name: plan
          dest: build/plan
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Reuse finished shard (content-hash cache)
        id: shardcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/images
          key: images-v2-${{ needs.prepare.outputs.img_hash }}-${{ needs.prepare.outputs.n_img }}-${{ matrix.shard }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.shardcache.outputs.cache-hit != 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/images.txt
      - name: Free disk
        if: steps.shardcache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h / | tail -1
      - name: Install
        if: steps.shardcache.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements/images.txt
      - name: SDXL-Lightning backgrounds + depth layers
        if: steps.shardcache.outputs.cache-hit != 'true'
        run: python -m factory.images build/plan/plan.json --out build/images --shard ${{ matrix.shard }} --shards ${{ needs.prepare.outputs.n_img || 7 }}
      - uses: ./.github/actions/pack
        with:
          name: images-${{ matrix.shard }}
          path: build/images
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  music:
    # reusable licence-safe music library: 6 moods rendered in parallel once, cached by content hash
    needs: prepare
    if: inputs.until != 'plan' && inputs.until != 'tts'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mood: [calm, tense, urgent, sorrow, climax, hopeful]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: musiccache
        with:
          path: build/musiclib
          key: musiclib-v1-${{ matrix.mood }}-${{ hashFiles('factory/synth.py', 'factory/musiclib.py') }}
      - name: Render this mood (skipped on cache hit)
        if: steps.musiccache.outputs.cache-hit != 'true'
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq libsndfile1
          python -m pip install numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1
          python -m factory.musiclib build/musiclib ${{ matrix.mood }}
      - uses: ./.github/actions/pack
        with:
          name: music-${{ matrix.mood }}
          path: build/musiclib
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  assemble:
    needs: [prepare, tts, images, music]
    # images may fail: assemble then falls back to the procedural SVG backdrops and records it in the QA warnings
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && needs.tts.result == 'success' && needs.music.result != 'failure' && !contains('plan tts images', inputs.until || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      chunks: ${{ steps.asm.outputs.chunks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install audio dependencies
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq && sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg libsndfile1
          python -m pip install numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 pillow==10.4.0
      - uses: ./.github/actions/unpack
        with:
          name: plan
          dest: build/plan
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - uses: ./.github/actions/unpack
        with:
          name: tts-all
          pattern: tts-*
          dest: build/tts
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - uses: ./.github/actions/unpack
        continue-on-error: true
        with:
          name: images-all
          pattern: images-*
          dest: build/images
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Assemble timeline, captions, chapters
        id: asm
        run: |
          mkdir -p build/images
          python -m factory.assemble --plan build/plan/plan.json --tts build/tts --images build/images --out build/assembled
      - uses: ./.github/actions/unpack
        continue-on-error: true
        with:
          name: music-all
          pattern: music-*
          dest: build/musiclib
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Mix audio (voice chain, music, sfx, ducking, loudnorm -14 LUFS)
        run: |
          MUSIC_LIB_DIR=build/musiclib python -m factory.mix --plan build/assembled/audio_plan.json --voice build/assembled/voice --out build/assembled
          cp build/plan/plan.json build/assembled/plan.json
      - name: Video Doctor Stage 0+1 (face-overlap lint with auto-fix, audio Doctor on the final mix with fix loop, max 3 passes)
        continue-on-error: true
        env:
          MUSIC_LIB_DIR: build/musiclib
        run: |
          python -m factory.doctor.run lint --asm build/assembled
          python -m factory.doctor.run audio --asm build/assembled --voice build/assembled/voice --passes 5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1
      - name: Video Doctor voice stage (faster-whisper base.en versus the script, MIT)
        continue-on-error: true
        run: |
          python -m pip install -q faster-whisper==1.0.3 requests
          python -m factory.doctor.voice --asm build/assembled --tts build/tts --model small.en
      - name: Video Doctor Stage 3 (background blotch/banding/style check with soft-grade repair)
        continue-on-error: true
        run: python -m factory.doctor.look build/assembled
      - uses: ./.github/actions/pack
        with:
          name: assembled
          path: build/assembled
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  thumbs:
    needs: [prepare, images]
    if: ${{ always() && !cancelled() && needs.prepare.result == 'success' && !contains('plan tts images', inputs.until || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: System libraries
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
          python -m pip install numpy==1.26.4 pillow==10.4.0 opencv-python-headless==4.10.0.84 rapidocr-onnxruntime==1.3.24
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: video/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('video/package.json', 'video/package-lock.json') }}
      - name: Install video dependencies
        working-directory: video
        run: npm install --no-audit --no-fund --loglevel=error
      - uses: ./.github/actions/unpack
        with:
          name: plan
          dest: build/plan
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - uses: ./.github/actions/unpack
        continue-on-error: true
        with:
          name: images-all
          pattern: images-*
          dest: build/images
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Stage backgrounds and render thumbnail candidates
        run: |
          mkdir -p video/public/bg build/thumbs build/images
          find build/images -name '*.jpg' ! -name '*.far.jpg' -exec cp {} video/public/bg/ \;
          python -m factory.thumbnails --plan build/plan/plan.json --bg video/public/bg --video video --out build/thumbs
          find build/thumbs -type d -name 'seq_*' -prune -exec rm -r {} +
      - uses: ./.github/actions/pack
        with:
          name: thumbs
          path: build/thumbs
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  render:
    needs: [prepare, assemble]
    if: ${{ !contains('plan tts images assemble', inputs.until || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.assemble.outputs.chunks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: System libraries
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: video/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('video/package.json', 'video/package-lock.json') }}
      - name: Install video dependencies
        working-directory: video
        run: npm install --no-audit --no-fund --loglevel=error
      - uses: ./.github/actions/unpack
        with:
          name: assembled
          dest: build/assembled
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Render chunk ${{ matrix.chunk }} (video only, 1080p30, CRF 18)
        run: |
          mkdir -p video/public/bg build/chunk
          cp -r build/assembled/bg/. video/public/bg/
          read FROM TO < <(python -c "import json;c=[x for x in json.load(open('build/assembled/chunks.json')) if x['i']==${{ matrix.chunk }}][0];print(c['from'],c['to'])")
          cd video
          npx remotion render src/index.ts Story ../build/chunk/chunk_${{ matrix.chunk }}.mp4 --props="$GITHUB_WORKSPACE/build/assembled/props.json" --frames=$FROM-$TO --concurrency=4 --muted --log=warn
      - uses: ./.github/actions/pack
        with:
          name: chunk-${{ matrix.chunk }}
          path: build/chunk
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}

  finalize:
    needs: [prepare, assemble, thumbs, render]
    if: ${{ !contains('plan tts images assemble render', inputs.until || 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: System libraries
        run: |
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
          sudo timeout 600 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg age libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
          python -m pip install numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 pillow==10.4.0 opencv-python-headless==4.10.0.84
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: video/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('video/package.json', 'video/package-lock.json') }}
      - name: Install video dependencies (for chunk re-renders)
        working-directory: video
        run: npm install --no-audit --no-fund --loglevel=error
      - uses: ./.github/actions/unpack
        with:
          name: assembled
          dest: build/assembled
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - uses: ./.github/actions/unpack
        with:
          name: chunks-all
          pattern: chunk-*
          dest: build/chunks
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - uses: ./.github/actions/unpack
        with:
          name: thumbs
          dest: build/thumbs
          mode: ${{ needs.prepare.outputs.mode }}
          key: ${{ secrets.BACKUP_KEY }}
      - name: Concat, mux, QA, auto-fix loop (max 2 rounds), scorecard
        id: fin
        run: |
          mkdir -p video/public/bg build/final
          cp -r build/assembled/bg/. video/public/bg/
          N=$(python -c "import json;print(len(json.load(open('build/assembled/plan.json'))['sources']))")
          python -m factory.finalize --chunks-dir build/chunks --assembled build/assembled --video-dir video --thumbs build/thumbs --out build/final --plan build/assembled/plan.json --sources $N
      - name: True-peak safety after the AAC encode (clamps only the offending transient, loudness untouched)
        if: always() && hashFiles('build/final/final.mp4') != ''
        continue-on-error: true
        run: python -m factory.tpfix build/final/final.mp4 build/assembled/master.wav
      - name: Video Doctor Stage 2 (fast scan of the FINAL mp4, certificate with its sha256)
        id: doc
        if: always() && hashFiles('build/final/final.mp4') != ''
        run: |
          python -m factory.doctor.run final --mp4 build/final/final.mp4 --asm build/assembled --out build/final/doctor
          python -c "import json;print('status='+json.load(open('build/final/doctor/CERTIFICATE.json'))['status'])" >> "$GITHUB_OUTPUT"
      - name: Certificate gate (no certificate, modified mp4 or stale certificate means no delivery)
        id: gate
        if: steps.doc.outcome == 'success'
        continue-on-error: true
        run: python -m factory.doctor.cert verify build/final/final.mp4 build/final/doctor/CERTIFICATE.json
      - name: PerTh watermark check on the final mp4 audio (records the result, never blocks)
        continue-on-error: true
        run: |
          python -m pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "setuptools<81" resemble-perth==1.0.1 librosa pyyaml tqdm
          python -m factory.wmcheck build/final/final.mp4 build/assembled build/final/watermark_report.json
      - name: Contact sheet (20 frames)
        run: |
          D=$(python -c "import json;print(json.load(open('build/final/qa_report.json'))['duration']['actual'])")
          ffmpeg -v error -y -i build/final/final.mp4 -vf "fps=20/$D,scale=480:-1,tile=5x4" -frames:v 1 build/final/contact.jpg
      - name: Metadata and YouTube Info
        if: steps.fin.outputs.status == 'ok'
        run: |
          NNN=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['nnn'])")
          ST=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['short_title'])")
          python -m factory.metadata --plan build/assembled/plan.json --chapters build/assembled/chapters.json --base "$(printf '%03d' $NNN) $ST $(printf '%02d' ${{ steps.fin.outputs.minutes }})min" --out build/final/info.txt
      - name: Bundle (age-encrypted), release, notify
        id: bundle
        if: steps.fin.outputs.status == 'ok' && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NNN=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['nnn'])")
          ST=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['short_title'])")
          python -m factory.bundle --nnn "$NNN" --short-title "$ST" --minutes ${{ steps.fin.outputs.minutes }} --video build/final/final.mp4 --thumb1 build/thumbs/thumb1.jpg --thumb2 build/thumbs/thumb2.jpg --info build/final/info.txt --srt build/assembled/captions.srt --certificate build/final/doctor/CERTIFICATE.json --recipient "$AGE_RECIPIENT" --out build/bundle
          TAG="video-$(printf '%03d' $NNN)"
          if gh release view "$TAG" >/dev/null 2>&1; then gh release upload "$TAG" build/bundle/* --clobber; else gh release create "$TAG" build/bundle/* --title "$TAG" --notes "video $(printf '%03d' $NNN): ready"; fi
          gh issue create --title "video $(printf '%03d' $NNN): ready" --body "status: ok" || true
      - name: YouTube private upload (skipped without secrets, never fails the video)
        if: steps.fin.outputs.status == 'ok' && steps.gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          NNN=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['nnn'])")
          gh release download ledger -p youtube-ledger.json -D build --clobber 2>/dev/null || echo '{}' > build/youtube-ledger.json
          python -m factory.publish --nnn "$NNN" --base "${{ steps.bundle.outputs.base_name }}" --video build/final/final.mp4 --thumb build/thumbs/thumb1.jpg --srt build/assembled/captions.srt --info build/final/info.txt --ledger build/youtube-ledger.json || true
          if [ -n "$YT_REFRESH_TOKEN" ]; then
            gh release view ledger >/dev/null 2>&1 || gh release create ledger --title ledger --notes "upload ledger (video numbers and ids only)"
            gh release upload ledger build/youtube-ledger.json --clobber || true
          fi
      - name: Report held video
        if: steps.fin.outputs.status != 'ok' || steps.gate.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NNN=$(python -c "import json;print(json.load(open('build/assembled/plan.json'))['nnn'])")
          gh issue create --title "video $(printf '%03d' $NNN): needs_review" --body "status: needs_review (QA or Video Doctor; see qa-report artifact: doctor/FAST_REPORT.json)" || true
      - name: Small QA bundle (no video)
        if: always()
        run: |
          mkdir -p build/qa
          cp -r build/final/doctor build/qa/doctor 2>/dev/null || true
          cp -r build/assembled/doctor build/qa/doctor_stage01 2>/dev/null || true
          cp build/final/qa_report.json build/final/scorecard.txt build/final/status.json build/final/contact.jpg build/final/info.txt build/final/licence_report.json build/final/watermark_report.json build/qa/ 2>/dev/null || true
      - uses: ./.github/actions/pack
        if: always()
        with:
          name: qa-report
          path: build/qa
          mode: ${{ needs.prepare.outputs.mode }}
          recipient: ${{ env.AGE_RECIPIENT }}
