name: analyze_reference
# Manual. Decrypts reference/reference.mp4 on the runner (needs the GIT_CRYPT_KEY secret), measures it, commits only the numbers.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AGE_RECIPIENT: age1a29zkhm3egxk30kdylsygf6pdkvkk2j6dz4h5qqacvga8ezf550qwl54rq

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preflight
        env:
          GIT_CRYPT_KEY: ${{ secrets.GIT_CRYPT_KEY }}
        run: |
          [ -n "$GIT_CRYPT_KEY" ] || { echo "::error::PREFLIGHT: GIT_CRYPT_KEY secret missing - add it (docs/USER_CHECKLIST.md step 1)"; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq git-crypt ffmpeg libsndfile1
          umask 077; printf '%s' "$GIT_CRYPT_KEY" | base64 -d > "$RUNNER_TEMP/gc.key"
          git-crypt unlock "$RUNNER_TEMP/gc.key"; rm -f "$RUNNER_TEMP/gc.key"
          ffprobe -v error -show_entries format=duration -of csv=p=0 reference/reference.mp4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1 pillow==10.4.0 opencv-python-headless==4.10.0.84 sherpa-onnx==2.0.1 rapidocr-onnxruntime==1.3.24
      - name: Analyse (measurement only)
        run: |
          mkdir -p build/ref
          python -m factory.analyze_reference reference/reference.mp4 --md docs/REFERENCE_ANALYSIS.md --json config/reference_metrics.json --work build/ref
          sudo apt-get install -y -qq age >/dev/null
          age -r "$AGE_RECIPIENT" -o build/ref/contact.jpg.age build/ref/contact.jpg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-contact-encrypted
          path: build/ref/contact.jpg.age
          retention-days: 3
      - name: Commit the numbers only
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/REFERENCE_ANALYSIS.md config/reference_metrics.json
          git commit -m "docs: reference analysis (measurements only)" || echo "no changes"
          git push origin HEAD:main
