name: ci
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Audio dependencies (numpy/scipy/soundfile + ffmpeg for the mix test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          python -m pip install numpy==1.26.4 scipy==1.13.1 soundfile==0.12.1
      - name: Unit tests (stdlib unittest)
        run: python -m unittest discover -s tests -v
      - name: Validate pilot scripts
        run: |
          for d in pilot/*/; do python -m factory.validate "$d"; done

  smoke:
    # 20 s smoke render of the Remotion project (rig, overlays, camera presets, FX) on every code change
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      - name: System libraries for headless Chrome and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libnss3 libdbus-1-3 libatk1.0-0t64 libasound2t64 libxrandr2 libxkbcommon-x11-0 libxfixes3 libxcomposite1 libxdamage1 libgbm-dev libcups2t64 libatk-bridge2.0-0t64 libpango-1.0-0 libcairo2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            video/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('video/package.json', 'video/package-lock.json') }}
      - name: Install video dependencies
        working-directory: video
        run: npm install --no-audit --no-fund --loglevel=error
      - name: Render 20 s smoke (frames 0-599) and the rig sheet
        working-directory: video
        run: |
          mkdir -p ../out
          npx remotion render src/index.ts Showcase ../out/smoke.mp4 --frames=0-599 --concurrency=4 --muted --log=warn
          npx remotion still src/index.ts RigSheet ../out/rigsheet.png --log=warn
      - name: Verify output and build contact sheet
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate,codec_name,pix_fmt,nb_frames -of default=nw=1 out/smoke.mp4
          ffmpeg -v error -y -i out/smoke.mp4 -vf "select='eq(mod(n,60),32)',scale=640:-1,tile=5x2" -frames:v 1 out/contact.png
          test -s out/contact.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-contact
          path: |
            out/contact.png
            out/rigsheet.png
          retention-days: 3

  risk-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - name: Risk guards (pinned SHAs, permissions, no cron, encryption of committed blobs, no secrets)
        run: python tools/risk_check.py
