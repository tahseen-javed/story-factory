# Video Doctor thresholds (P-012). Every check is numeric; severity: BLOCKER / MAJOR / MINOR. Zero BLOCKER and MAJOR at delivery.
version: 1
doctor_version: "1.0.0"
audio:
  integrated_lufs: [-15.0, -13.0]
  true_peak_max_db: -1.5
  lra: [4.0, 8.0]
  voice_short_term_lufs: [-16.5, -13.0]     # median while speaking (spec -16..-14)
  music_below_voice_db: [15.0, 21.0]        # median gap voice minus music while speaking (spec 18-22)
  music_local_min_gap_db: 12.0              # anywhere while speaking: music louder than this is a BLOCKER
  music_rise_max_db: 6.5                    # music may rise at most this much in non-speech moments
  music_jump_max_lu: 3.0                    # change over 1 s
  music_dropout_lufs: -55.0
  music_dropout_s: 1.0
  gap_max_s: 0.9
  beat_max_count: 2
  beat_max_s: 2.0
  decision_hold_max_s: 5.0      # a planned 'decision_hold' (cards on screen, clock ticking, room tone + heartbeat) may be this long
  decision_hold_per_s: 40       # ... at most one per this many seconds of video
  sentence_loudness_std_max_lu: 2.0
  wpm_overall: [125.0, 165.0]
  sfx_margin_db: 2.0
  hot_start_dbfs: -30.0
  tail_max_dbfs: -45.0
  dc_offset_max: 0.002
  mono_compat_drop_max_db: 3.0
  calm_flux_p99_max: null                   # calibrated from the music identity (set after the first measured run)
  calm_centroid_std_max_hz: null
  calm_hf_ratio_max_db: null
sync:
  caption_start_ms: 80
  drift_ms: 40
visual:
  face_overlap_max_ratio: 0.05
  face_overlap_min_frames: 2
  edge_cut_max_ratio: 0.02
  max_cps: 17.0
  caption_words: [1, 4]
  caption_min_height_ratio: 0.05
  contrast_min: 4.5
  max_static_s: 3.0
  scene_changes_per_min_min: 20.0           # P-011 target; MINOR until the pacing redesign lands
look:                                       # Phase 2 stage 3 (factory/doctor/look.py), thresholds calibrated on the first real backgrounds
  blotch_max: 0.04
  banding_max: 0.2
  style_edge_ratio_min: 0.35
  style_noise_ratio_max: 2.5
  style_saturation_delta: 45
tech:                                       # Phase 2 stage 4 (factory/doctor/tech.py)
  black_luma: 10
  black_std: 6
  dup_diff: 8                               # max pixel difference that still counts as an identical frame (gray 0-255, lossy-coded stills carry noise)
  dup_mean: 0.1
  dup_run_frames: 6
  freeze_s: 1.2
  flicker_luma_jump: 9
  flicker_max_per_s: 4
  cut_diff: 22                              # mean abs difference that counts as a hard cut
  cut_min_gap_s: 0.5
  unplanned_cut_s: 0.25
  unplanned_cut_diff: 40
  max_shot_s: 5.2
  shots_per_min_min: 14
  static_pose_s: 3.0
voice:                                      # Phase 2 stage 1 (factory/doctor/voice.py): faster-whisper versus the script
  wer_max: 0.05
  sentence_wer_max: 0.15
  wpm: [130, 160]
  drift_mel_db: 4.0
  drift_f0_hz: 40
  narrator_mel_db: 5.0
  narrator_f0_hz: 45
music_present:                              # P-014 / A3b MUSIC PRESENT
  audible_fraction_min: 0.90                # share of the video (planned beats excluded) where the music bed is audible
  audible_floor_lufs_below_voice: 30        # bed counts as audible when it is within this many dB of the voice short-term level
  below_voice_db: [15, 21]                  # while speaking (target 16-20)
  max_rise_db: 6.0
severity:
  music_missing: BLOCKER
  music_quiet: MAJOR
  stem_clip: MINOR                 # stems are pre-limiter; the master (sample peak / true peak) is what must not clip
  blotch: MAJOR
  banding: MINOR
  style: MINOR
  dup: MINOR
  flicker: MINOR
  cut: MINOR
  static: MINOR
  voice_wer: MAJOR
  voice_skip: MAJOR
  voice_double: MAJOR
  voice_wpm: MINOR
  voice_drift: MAJOR
  integrated: MAJOR
  true_peak: MAJOR
  lra: MINOR
  voice_level: MAJOR
  music_median: MAJOR
  music_local: BLOCKER
  music_above_voice: BLOCKER
  music_rise: MAJOR
  music_jump: MAJOR
  music_dropout: MAJOR
  music_calm: MINOR
  gap: MAJOR
  hold_long: MAJOR
  hold_count: MAJOR
  beats: MAJOR
  sentence_std: MINOR
  wpm: MINOR
  sfx_loud: MAJOR
  clipping: BLOCKER
  dc: MINOR
  hot_start: MAJOR
  tail: MINOR
  mono: MINOR
  caption_sync: MAJOR
  drift: MAJOR
  face_overlap: BLOCKER
  face_edge: MAJOR
  reading_speed: MAJOR
  caption_words: MINOR
  spelling: BLOCKER
  black: BLOCKER
  freeze: BLOCKER
  resolution: BLOCKER
  pacing_rate: MINOR
