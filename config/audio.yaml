# Sound design v2: 4 layers (voice, music, ambience, sfx), dynamic range, silence beats.
version: 2
duck_db: 6           # the bed may rise at most 6 dB when nobody speaks (P-012 A3)
music_below_voice_db: 17
hold_release_s: 1.2         # gentle entry and release of the bed around a decision hold (P-017 prevention)   # music bed sits 20 dB under the voice while speaking (P-012 A3: 18-22)
lra_min: 4.0
lra_target: 5.0
silence_beat_s: 0.9
silence_beats_min: 1
silence_floor_db: -50
sfx_gap_max_s: 3.8
music_bed_db: -26
# loudness offset per story act (dB, applied to the whole mix before the final loudnorm)
intensity_db:
  hook: 1.0
  act1: -1.5
  act2a: 0.0
  midpoint: 1.5
  act2b: 1.0
  sacrifice: -3.0
  climax: 2.0
  resolution: -2.5
music_mood:   # P-014: calm, simple, never irritating; a little tension in the middle, warm release at the end
  hook: calm
  act1: calm
  act2a: mystery
  midpoint: mystery
  act2b: mystery
  sacrifice: sorrow
  climax: tense
  resolution: hopeful
# per expression: [exaggeration, cfg_weight, speed]
emotion:
  neutral: [0.45, 0.50, 1.00]
  worried: [0.55, 0.45, 1.02]
  scared: [0.75, 0.35, 1.05]
  shocked: [0.80, 0.30, 1.04]
  determined: [0.60, 0.50, 1.02]
  relieved: [0.50, 0.50, 0.97]
  sad: [0.40, 0.55, 0.95]
  angry: [0.80, 0.40, 1.04]
  sleepy: [0.35, 0.55, 0.94]
  sly: [0.55, 0.45, 1.00]
  thinking: [0.40, 0.50, 0.97]
reverb_wet:
  indoor: 0.07
  outdoor: 0.13
