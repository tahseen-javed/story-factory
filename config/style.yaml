# Style bible v2 (one look for every scene of a series). Backdrops, props and characters all pass through this palette + outline + grade.
version: 2
palette:
  hues: ["#1c1a1f", "#f2e8d2", "#2a9d9a", "#7d416f", "#2d4a7a", "#c8453b"]   # ink, paper, teal, plum, denim, brick (max 6 hues)
  accents: ["#f2a33a", "#e6b422"]                                            # amber, gold
look:
  line_weight_px: 6
  grain: 0.16
  light_direction: top_left
  lens_blur_px: 8
  texture: paper_grain
  posterize_colors: 14
  palette_pull: 0.5        # how far each posterised colour is pulled toward the nearest bible hue (lightness kept)
  outline_strength: 0.5
qa:
  palette_distance_max: 34   # mean LAB distance of a scene to the bible; outliers above this are flagged
  outlier_share_max: 0.15
# Story act -> colour grade: warm normal life, cold panic, red alarm, exhausted grey, hopeful gold
acts:
  hook: cold
  act1: warm
  act2a: cold
  midpoint: alarm
  act2b: alarm
  sacrifice: grey
  climax: alarm
  resolution: gold

# P-008 B: every character is cute and unique (enforced for style_version >= 3 by factory/cast.py)
characters:
  cute: true
  head_scale: 1.5          # default Rig headScale for new casts (rig head height 126 of 450 total at scale 1.0)
  eye_scale: 1.25          # default Rig eyeScale (large friendly eyes)
  head_to_body_min: 0.36   # head height / total figure height
  eye_to_head_min: 0.30    # eye height / head height
  rounded: true            # soft shapes only (rig is built from rounded paths)
  rig: {head_height: 126, body_height: 450, eye_height: 36}
  warm_palette_only: true
  banned_words: [gore, blood, skull, weapon, gun, knife, zombie_face, monster_teeth, scary_mask]
  cast_similarity_max: 0.5
  shot_similarity_max: 0.5
