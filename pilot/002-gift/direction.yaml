  bath: "top-down view of a copper bathtub full of soap bubbles on a wooden floor, warm light, cozy bathroom seen from above"
  hollow: "cozy tree hollow home interior with a round window, a knitting basket and yarn balls, soft lilac and silver light"
  workbench: "small woodworking bench next to a glowing fireplace, wood shavings and carving tools, warm firelight, cozy round cottage interior"
  market: "snowy village market lane with a shop window displaying a glass snow globe, jingle bell garlands, warm shop lights"
  home: "cozy round cottage interior with a small table with a checkered tablecloth, a bed in the corner, a mirror on the wall and a window onto a frozen river"
  lane: "snowy village lane at night between round cottages, glowing lanterns, deep blue shadows"
